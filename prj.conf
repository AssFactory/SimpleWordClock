# Zephyr log subsys
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Acitvate I2C
CONFIG_I2C=y

# Activate rtc
CONFIG_RTC=y
CONFIG_MFD_DS3231=y
CONFIG_RTC_DS3231=y

# Activate sensor
CONFIG_SENSOR=y
CONFIG_BH1750=y

# Activate shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_I2C_SHELL=n
CONFIG_DATE_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_KERNEL_SHELL=n

# Activate serial console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Led strip
CONFIG_LED_STRIP=y