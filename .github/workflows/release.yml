name: Build and publish firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: SimpleWordClock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize firmware version with tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG"]
          match = re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", tag)
          if match is None:
              raise SystemExit(f"Release tag must use vMAJOR.MINOR.PATCH format: {tag}")

          major, minor, patch = match.groups()
          Path("SimpleWordClock/VERSION").write_text(
              f"VERSION_MAJOR = {major}\n"
              f"VERSION_MINOR = {minor}\n"
              f"PATCHLEVEL = {patch}\n"
              "VERSION_TWEAK = 0\n"
              "EXTRAVERSION =\n",
              encoding="utf-8",
          )
          PY

      - name: Set up Zephyr workspace
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a
        with:
          app-path: SimpleWordClock
          toolchains: arm-zephyr-eabi

      - name: Build firmware
        working-directory: SimpleWordClock
        run: west build -s . -d build -b adafruit_itsybitsy_rp2040 -p always

      - name: Verify firmware image
        run: test -s SimpleWordClock/build/zephyr/zephyr.uf2

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: SimpleWordClock/build/zephyr/zephyr.uf2
          fail_on_unmatched_files: true
